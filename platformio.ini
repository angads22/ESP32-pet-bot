; PetBot — PlatformIO build configuration (two boards, one repo)
;
;   pio run -e petbot_s3            # S3 brain, BLE-only
;   pio run -e petbot_s3_wifi       # S3 brain + captive-portal web UI
;   pio run -e petbot_s3_stream     # S3 brain + web UI + MJPEG camera stream
;   pio run -e petbot_c6            # C6 thin display client
;
; Default transport between boards is UART (PB_TRANSPORT_UART=1).
; USB CDC (PB_TRANSPORT_USBCDC=1) is currently a stub — see
; firmware/s3_cam_brain/petbot_s3.ino and firmware/c6_display_client/petbot_c6.ino.

[platformio]
default_envs = petbot_s3
src_dir = .

[env]
framework = arduino
monitor_speed = 115200

; ─── Shared S3 brain settings ────────────────────────────────────────────────
[s3_base]
platform = espressif32
; Adjust if your specific S3-CAM carrier needs a different board id.
board = esp32-s3-devkitc-1
upload_speed = 921600
board_build.partitions = huge_app.csv
build_flags =
    -I shared
    -I firmware/s3_cam_brain/src
    -I firmware/s3_cam_brain/src/transport
    -D PB_TRANSPORT_UART=1
build_src_filter =
    +<firmware/s3_cam_brain/petbot_s3.ino>
    +<shared/protocol/frame.cpp>
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3

[env:petbot_s3]
extends = s3_base

[env:petbot_s3_wifi]
extends = s3_base
build_flags =
    -I shared
    -I firmware/s3_cam_brain/src
    -I firmware/s3_cam_brain/src/transport
    -D PB_TRANSPORT_UART=1
    -D PETBOT_ENABLE_WIFI=1
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    tzapu/WiFiManager @ ^2.0.17

[env:petbot_s3_stream]
extends = s3_base
; NOTE: for the camera stream to work the board must be the AI-Thinker ESP32-CAM
; (or Freenove ESP32-WROVER CAM). Change 'board' below to 'esp32cam' if needed.
build_flags =
    -I shared
    -I firmware/s3_cam_brain/src
    -I firmware/s3_cam_brain/src/transport
    -D PB_TRANSPORT_UART=1
    -D PETBOT_ENABLE_WIFI=1
    -D PETBOT_ENABLE_STREAM=1
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    tzapu/WiFiManager @ ^2.0.17
    espressif/esp32-camera @ ^2.0.0

; ─── C6 thin display client ──────────────────────────────────────────────────
[env:petbot_c6]
platform = espressif32
board = esp32-c6-devkitc-1
upload_speed = 921600
build_flags =
    -I shared
    -I firmware/c6_display_client/src
    -I firmware/c6_display_client/src/transport
    -D PB_TRANSPORT_UART=1
build_src_filter =
    +<firmware/c6_display_client/petbot_c6.ino>
    +<shared/protocol/frame.cpp>
; Library versions pinned to what Waveshare's ESP32-C6-LCD-1.47 examples target.
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    bitbank2/PNGdec @ 1.0.2
