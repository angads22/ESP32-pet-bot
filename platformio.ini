; PetBot — PlatformIO build configuration (two boards, one repo)
;
;   pio run -e petbot_s3_ap         # S3 brain — Phase 1 default: open AP + camera + web app
;   pio run -e petbot_s3             # S3 brain, BLE-only (no WiFi)
;   pio run -e petbot_s3_wifi        # S3 brain + WiFiManager captive portal (home WiFi)
;   pio run -e petbot_s3_stream      # S3 brain + home WiFi + MJPEG camera stream
;   pio run -e petbot_c6             # C6 thin display client (deferred to Phase 2)
;
; Default transport between boards is UART (PB_TRANSPORT_UART=1).
; USB CDC (PB_TRANSPORT_USBCDC=1) is currently a stub — see
; firmware/*/src/transport/transport_usbcdc.cpp.

[platformio]
default_envs = petbot_s3_ap
src_dir = .

[env]
framework = arduino
monitor_speed = 115200

; ─── Shared S3 brain settings ────────────────────────────────────────────────
[s3_base]
platform = espressif32
; Freenove ESP32-S3 WROOM CAM uses the standard S3 dev module pinout for the
; non-camera GPIOs. The OV2640 pin map is selected at compile time in
; vision.cpp (default = Freenove S3 CAM; AI-Thinker via -DPETBOT_BOARD_AITHINKER=1).
board = esp32-s3-devkitc-1
upload_speed = 921600
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -I shared
    -I firmware/s3_cam_brain/src
    -D PB_TRANSPORT_UART=1
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<firmware/s3_cam_brain/src/>
    +<shared/protocol/frame.cpp>
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3

[env:petbot_s3]
extends = s3_base

; ─── Phase 1 default: open AP + camera + web app ─────────────────────────────
[env:petbot_s3_ap]
extends = s3_base
build_flags =
    ${s3_base.build_flags}
    -D PETBOT_AP_MODE=1
    -D PETBOT_ENABLE_STREAM=1
; No WiFiManager in AP mode — straight to softAP.
lib_deps =
    ${s3_base.lib_deps}

[env:petbot_s3_wifi]
extends = s3_base
build_flags =
    ${s3_base.build_flags}
    -D PETBOT_ENABLE_WIFI=1
lib_deps =
    ${s3_base.lib_deps}
    tzapu/WiFiManager @ ^2.0.17

[env:petbot_s3_stream]
extends = s3_base
build_flags =
    ${s3_base.build_flags}
    -D PETBOT_ENABLE_WIFI=1
    -D PETBOT_ENABLE_STREAM=1
lib_deps =
    ${s3_base.lib_deps}
    tzapu/WiFiManager @ ^2.0.17

; ─── C6 thin display client (Phase 2 — deferred) ─────────────────────────────
[env:petbot_c6]
platform = espressif32
board = esp32-c6-devkitc-1
upload_speed = 921600
build_flags =
    -I shared
    -I firmware/c6_display_client/src
    -D PB_TRANSPORT_UART=1
build_src_filter =
    +<firmware/c6_display_client/src/>
    +<shared/protocol/frame.cpp>
; Library versions pinned to what Waveshare's ESP32-C6-LCD-1.47 examples target.
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    bitbank2/PNGdec @ 1.0.2

